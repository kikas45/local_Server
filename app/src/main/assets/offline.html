<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page Unreachable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            color: #cc0000;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
            margin: 10px 0;
        }
        .failed-url {
            display: block;
            margin: 15px 0;
            font-size: 1.4em;   /* 🔹 slightly larger */
            font-weight: bold;  /* 🔹 bold */
            color: #000;
            background: #eee;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-word;
        }
        ol {
            text-align: justify;  /* 🔹 justified list */
            margin: 15px 0;
            padding-left: 18px;   /* 🔹 tighter start */
            list-style-position: inside; /* 🔹 numbers align neatly */
            color: #444;
            font-size: 1.05em;
        }
        strong {
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Page Unreachable</h1>
    <p>We tried to load:</p>
    <span class="failed-url">{{URL}}</span>

    <p>Possible reasons include:</p>
    <ol>
        <li>The server may be disconnected.</li>
        <li>The page may have moved to another location.</li>
        <li>There could be network-related issues.</li>
    </ol>

    <p>
        Please <strong>check your Wi-Fi, Ethernet or LAN connection</strong><br>
        and try again.
    </p>
</div>
</body>
</html>
